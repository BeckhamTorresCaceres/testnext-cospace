name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      JWT_ACCESS_SECRET: "ci_jwt_access_secret_min_32_characters_key_12345"
      JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_min_32_characters_key_12345"
      AUTH_SECRET: "ci_auth_secret_minimum_32_characters_long_key"
      AUTH_GOOGLE_ID: "ci_dummy_google_client_id"
      AUTH_GOOGLE_SECRET: "ci_dummy_google_client_secret"
      NEXT_PUBLIC_TIMEZONE: "America/Bogota"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js application
        run: npm run build

  docker-build:
    name: Docker Build Validation
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cospace-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    name: Deploy to AWS EC2
    needs: [validate, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" "bash -s" << REMOTE_EOF
            set -e
            echo "==> Deploying branch: ${TARGET_BRANCH} on AWS EC2..."
            cd ~/testnext-cospace
            git pull origin ${TARGET_BRANCH}
            npm ci
            npm run build
            cp .env .next/standalone/.env
            cp .env .next/standalone/.env.production
            cp -r public .next/standalone/ 2>/dev/null || true
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
            pm2 restart cospace --update-env
            pm2 save
            echo "==> Deployment to AWS EC2 completed successfully!"
          REMOTE_EOF
